############################
# HYPRLAND MAC STYLE CONFIG
############################

monitor=,preferred,auto,1

############################
# APPS
############################

$mainMod = SUPER

$terminal = kitty
$fileManager = nautilus
$menu = walker

############################
# AUTOSTART
############################

exec-once = hyprpaper
exec-once = dunst

############################
# INPUT
############################

input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle

    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }

    sensitivity = 0
}

############################
# GENERAL
############################

general {
    gaps_in = 8
    gaps_out = 24

    border_size = 1

    col.active_border = rgba(cdd6f4ff)
    col.inactive_border = rgba(6c708655)

    resize_on_border = true

    layout = dwindle
}

############################
# DECORATION
############################

decoration {

    rounding = 18

    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 18
        render_power = 3
    }

    blur {
        enabled = true
        size = 5
        passes = 2
        vibrancy = 0.18
    }
}

############################
# ANIMATIONS
############################

animations {
    enabled = true

    bezier = mac,0.23,1,0.32,1

    animation = windows,1,8,mac
    animation = windowsOut,1,8,mac,popin 85%
    animation = border,1,10,default
    animation = fade,1,8,default
    animation = workspaces,1,7,mac
}

############################
# DWINDLE
############################

dwindle {
    pseudotile = true
    preserve_split = true
}

############################
# MISC
############################

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
}

############################
# WINDOW RULES
############################

windowrulev2 = float,class:^(pavucontrol)$
windowrulev2 = float,class:^(blueman-manager)$
windowrulev2 = float,class:^(nm-connection-editor)$
windowrulev2 = float,class:^(org.gnome.Nautilus)$

############################
# APPS
############################

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, SPACE, exec, $menu

############################
# WINDOWS
############################

bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exit

bind = $mainMod, F, fullscreen
bind = $mainMod, V, togglefloating

############################
# FOCUS
############################

bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

############################
# MOVE WINDOWS
############################

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

############################
# RESIZE
############################

bind = $mainMod CTRL, H, resizeactive, -80 0
bind = $mainMod CTRL, L, resizeactive, 80 0
bind = $mainMod CTRL, K, resizeactive, 0 -80
bind = $mainMod CTRL, J, resizeactive, 0 80

############################
# WORKSPACES
############################

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

############################
# MOUSE
############################

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

############################
# MEDIA KEYS
############################

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bindel = ,XF86MonBrightnessUp, exec, brightnessctl set +10%
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 10%-

############################
# GESTURES
############################

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}
